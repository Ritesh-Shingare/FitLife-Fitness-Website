<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="stylesheet" href="style.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <title>Contact - FitLife</title>
  </head>
  <body>
    <div class="page-container">
    <nav>
      <a href="index.html" >Home</a>
      <a href="about.html" >About</a>
      <a href="contact.html" >Contact</a>
      <a href="course.html" >Course</a>
    </nav>
    <header>
      <h1><i class="fas fa-phone"></i> Contact Us </h1>
    </header>
    <main>
      <h2>You can connect with us easily</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="name" name="name"/><br /><br />

        <label for="contact">Phone Number:</label>
        <input type="tel" id="contact" placeholder="phone number" name="contact"/><br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="email" name="email"/><br /><br />

        <label for="message">Message:</label>
        <textarea id="message" placeholder="your message" rows="4" cols="50" name="message"></textarea><br /><br />

        <button type="submit">Submit</button>
      </form>
    </main>
    <img
      src="https://tse4.mm.bing.net/th/id/OIP.NcpR-HOd12zhuf0zxLvQXQHaG8?r=0&pid=Api&P=0&h=180"
      alt="contact us"
    />
    </div>
  </body>
</html>
